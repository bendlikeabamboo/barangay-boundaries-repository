name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Run ruff in an isolated environment (no project deps required), so the
      # lint check is independent of the local-only sibling `barangay` dependency.
      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    # Tests import the package, which depends on a local sibling editable package
    # (`../barangay`) that is not available in CI. Results are surfaced for
    # visibility without failing the overall workflow status / badge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Create placeholder sibling package
        run: |
          mkdir -p ../barangay/barangay
          cat > ../barangay/pyproject.toml <<'EOF'
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"
          [project]
          name = "barangay"
          version = "0.0.0"
          [tool.hatch.build.targets.wheel]
          packages = ["barangay"]
          EOF
          touch ../barangay/barangay/__init__.py

      - name: Sync dependencies
        run: uv sync --extra dev || uv sync --all-extras

      - name: Run pytest
        run: uv run pytest -q
