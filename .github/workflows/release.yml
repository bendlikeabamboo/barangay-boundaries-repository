name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot date to release (e.g. 2023-10-24)"
        required: true
        default: "2023-10-24"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve snapshot date
        id: snap
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "date=${{ inputs.snapshot }}" >> "$GITHUB_OUTPUT"
          else
            # Strip the leading 'v' from a vX.Y.Z / vYYYY-MM-DD tag.
            TAG="${GITHUB_REF_NAME#v}"
            echo "date=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release artifacts
        run: |
          bash scripts/build_release_artifacts.sh "${{ steps.snap.outputs.date }}"
          echo "ARTIFACT_DIR=build/${{ steps.snap.outputs.date }}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.snap.outputs.date }}"
          name: "PSGC snapshot ${{ steps.snap.outputs.date }} — Enriched Philippine Barangay Boundaries GeoJSON"
          body: |
            ## Enriched Philippine barangay boundaries — PSGC snapshot `${{ steps.snap.outputs.date }}`

            Philippine barangay, municipality, city, province, and region boundaries as
            **GeoJSON**, enriched with canonical **PSGC codes** and derived from **NAMRIA**
            administrative-boundary shapefiles (v2023-11-06) and **PSA** Philippine Standard
            Geographic Code snapshots.

            ### Downloads

            | Asset | Contents |
            |-------|----------|
            | `barangay-boundaries-${{ steps.snap.outputs.date }}-enriched.zip` | `adm0`–`adm4.geojson` (PSGC-enriched) |
            | `barangay-boundaries-${{ steps.snap.outputs.date }}-hierarchical.zip` | per-class extracts (barangays, provinces, regions, HUCs, …) |
            | `adm0.geojson` … `adm4.geojson` | individual enriched files |
            | `manifest.json` | MD5 / SHA-256 / size / feature count per file |

            ### Data coverage (2023-10-24)

            | Level | Matched | Coverage |
            |-------|--------:|---------:|
            | Region (ADM1) | 17 | 100.000% |
            | Province (ADM2) | 88 | 100.000% |
            | Municipality/City (ADM3) | 1,624 | 99.877% |
            | Barangay (ADM4) | 41,803 | 99.947% |
            | **Total** | **43,533** | **99.945%** |

            ### Attribution

            - PSGC data © **Philippine Statistics Authority (PSA)**.
            - Boundaries © **NAMRIA**, shapefile version 2023-11-06.
            - Code © Manuel Balmeo, MIT License.
          files: |
            ${{ env.ARTIFACT_DIR }}/barangay-boundaries-${{ steps.snap.outputs.date }}-enriched.zip
            ${{ env.ARTIFACT_DIR }}/barangay-boundaries-${{ steps.snap.outputs.date }}-hierarchical.zip
            ${{ env.ARTIFACT_DIR }}/manifest.json
            ${{ env.ARTIFACT_DIR }}/adm0.geojson
            ${{ env.ARTIFACT_DIR }}/adm1.geojson
            ${{ env.ARTIFACT_DIR }}/adm2.geojson
            ${{ env.ARTIFACT_DIR }}/adm3.geojson
            ${{ env.ARTIFACT_DIR }}/adm4.geojson
          generate_release_notes: true
          draft: false
          prerelease: false
