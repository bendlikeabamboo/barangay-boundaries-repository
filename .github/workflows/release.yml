name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, including leading 'v' (e.g. v2026.4.13.0)"
        required: true
        default: "v2026.4.13.0"
      snapshot:
        description: "Snapshot date to release (e.g. 2023-10-24)"
        required: true
        default: "2023-10-24"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version and snapshot
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "snapshot=${{ inputs.snapshot }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: the version IS the tag. The snapshot it ships is decoupled
            # and defaults to the fully enriched 2023-10-24 snapshot (use
            # workflow_dispatch to release a different snapshot).
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "snapshot=2023-10-24" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build release artifacts
        run: |
          bash scripts/build_release_artifacts.sh "${{ steps.vars.outputs.snapshot }}"
          echo "ARTIFACT_DIR=build/${{ steps.vars.outputs.snapshot }}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ steps.vars.outputs.version }}"
          name: "${{ steps.vars.outputs.version }} — Hierarchical Philippine Barangay Boundaries GeoJSON (snapshot ${{ steps.vars.outputs.snapshot }})"
          body: |
            ## Curated hierarchical Philippine barangay boundaries — `${{ steps.vars.outputs.version }}` (snapshot `${{ steps.vars.outputs.snapshot }}`)

            Philippine barangay, municipality, and city (split by legal class), province, region, and
            special-geographic-area boundaries as **per-class GeoJSON** — the curated end product — with
            every polygon annotated with its canonical **PSGC code**. Derived from **PSA** Philippine
            Standard Geographic Code snapshots and **NAMRIA** administrative-boundary shapefiles
            (v2023-11-06). The `enriched` (`adm0`–`adm4`) and `raw` NAMRIA-converted files are
            intermediate pipeline stages kept in-repo for traceability (not attached to this release).

            ### Downloads

            | Asset | Contents |
            |-------|----------|
            | `barangay-boundaries-${{ steps.vars.outputs.snapshot }}-hierarchical.zip` | per-class GeoJSON bundle (barangays, provinces, regions, HUC/ICC/component cities, …) |
            | `barangays.geojson`, `regions.geojson`, `provinces.geojson`, … | individual per-class extracts |
            | `classification_report.json`, `summary.md` | per-class counts + classification summary |
            | `manifest.json` | MD5 / SHA-256 / size / feature count per file |

            ### Data coverage (${{ steps.vars.outputs.snapshot }})

            | Level | Matched | Coverage |
            |-------|--------:|---------:|
            | Region (ADM1) | 17 | 100.000% |
            | Province (ADM2) | 88 | 100.000% |
            | Municipality/City (ADM3) | 1,624 | 99.877% |
            | Barangay (ADM4) | 41,803 | 99.947% |
            | **Total** | **43,533** | **99.945%** |

            ### Attribution

            - PSGC data © **Philippine Statistics Authority (PSA)**.
            - Boundaries © **NAMRIA**, shapefile version 2023-11-06.
            - Code © Manuel Balmeo, MIT License.
          files: |
            ${{ env.ARTIFACT_DIR }}/barangay-boundaries-${{ steps.vars.outputs.snapshot }}-hierarchical.zip
            ${{ env.ARTIFACT_DIR }}/manifest.json
            ${{ env.ARTIFACT_DIR }}/classification_report.json
            ${{ env.ARTIFACT_DIR }}/summary.md
            ${{ env.ARTIFACT_DIR }}/*.geojson
          generate_release_notes: true
          draft: false
          prerelease: false
